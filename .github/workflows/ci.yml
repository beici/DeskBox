name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test:
    name: Build and test
    runs-on: windows-latest
    env:
      RestoreLockedMode: true
      # Keep latestPatch resolution away from newer SDKs preinstalled on the runner.
      DOTNET_INSTALL_DIR: ${{ runner.temp }}/deskbox-dotnet
      DOTNET_MULTILEVEL_LOOKUP: 0

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Commit message attribution check
        if: github.event_name == 'pull_request'
        shell: pwsh
        run: |
          $messages = git log --format=%B "${{ github.event.pull_request.base.sha }}..HEAD"
          if ($messages -match '(?im)^\s*(co-authored-by|generated[ -]with|generated-by)\s*[: ]') {
            Write-Host 'Forbidden attribution trailer (Co-Authored-By / Generated with) found in commit messages.'
            exit 1
          }

      - name: Setup pinned .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        shell: pwsh
        run: |
          $expectedSdk = (Get-Content global.json -Raw | ConvertFrom-Json).sdk.version
          if ((dotnet --version).Trim() -ne $expectedSdk) {
            throw "The isolated SDK does not match global.json ($expectedSdk)."
          }
          dotnet restore .\DeskBox.sln --locked-mode -p:Platform=x64 -p:RuntimeIdentifier=win-x64

      - name: Build
        run: dotnet build .\src\DeskBox\DeskBox.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -v:minimal

      - name: Test
        timeout-minutes: 10
        run: dotnet test .\tests\DeskBox.Tests\DeskBox.Tests.csproj --configuration Release --no-restore -p:Platform=x64 -p:RuntimeIdentifier=win-x64 -p:WindowsAppSdkBootstrapInitialize=false --blame-hang --blame-hang-timeout 5m --logger "trx;LogFileName=test-results.trx" -v:minimal

      # R2-P1-2: the static gate (l10n key parity, async-void / sync-wait /
      # clipboard-pairing budgets, contract-assertion replay) used to run only
      # on an ad-hoc Linux box; running it here catches drift on every PR.
      # It falls back to a pure-Python scanner when ripgrep is absent, so no
      # extra tool install is needed.
      - name: Static quality gate
        shell: pwsh
        run: |
          python -m unittest discover -s scripts/quality -p test_static_gate.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/quality/static_gate.py

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: tests/DeskBox.Tests/TestResults/**/*.trx
